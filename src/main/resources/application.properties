# ===============================
# CORE APPLICATION SETTINGS
# ===============================
spring.application.name=artiselite
server.port=${SERVER_PORT:8090}

# Error Handling (Fixed for Spring Boot 3)
server.error.include-message=ALWAYS
server.error.include-binding-errors=ALWAYS

# ===============================
# DATABASE CONFIGURATION (Merged)
# ===============================
# We use 'localhost' because you are running the Java App locally,
# connecting to the Docker Database exposed on port 5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/db
spring.datasource.username=postgres
spring.datasource.password=3112
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# The dialect is auto-detected, but if you want to be explicit:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FILE UPLOAD SETTINGS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.max-size=10485760

# ===============================
# SECURITY & JWT
# ===============================
# Valid Base64 Secret (Fixed from previous step)
jwt.secret=${JWT_SECRET:RXhhbXBsZVNlY3JldEtleUZvckpXVFNpZ25pbmcyNTZiaXRCYXNlNjRFbmNvZGVk}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS (Frontend Access)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.wms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# WebSocket Configuration
websocket.allowed-origins=http://localhost:3000,http://localhost:4200