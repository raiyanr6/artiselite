# ===============================
# TEST PROFILE OVERRIDES
# ===============================
# Only active when a test activates the "test" Spring profile (@ActiveProfiles("test")).
# Uses H2 in PostgreSQL-compatibility mode instead of a real Postgres instance.
# See summary notes for why H2 was chosen over Testcontainers for this project.

spring.datasource.url=jdbc:h2:mem:artiselite-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deterministic JWT config for assertions in tests
jwt.secret=RXhhbXBsZVRlc3RTZWNyZXRLZXlGb3JKV1RTaWduaW5nVGVzdHMxMjM0NTY=
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Avoid writing barcode files into the real ./uploads directory during tests
file.upload-dir=./target/test-uploads

logging.level.root=WARN
logging.level.org.springframework.security=INFO

# Never call the real OpenAI API from tests, even if a local .env has a key.
# (LiveOpenAiSmokeTest overrides this on purpose, and only when LIVE_LLM_TEST=true.)
app.agent.openai.api-key=
