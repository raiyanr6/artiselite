version: '3.8'

services:
  # Backend (Spring Boot) — now connects to AWS RDS instead of a local container
  backend:
    build: .
    container_name: wms-backend
    ports:
      - "8090:8090"
    environment:
      DB_HOST: db-artiselite.cn2mwqaw6zft.us-east-2.rds.amazonaws.com
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8090

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend,http://localhost,http://18.225.4.32
    volumes:
      - uploads_data:/app/uploads
    networks:
      - wms-network
    restart: unless-stopped

  # Frontend (React, built to static files at image-build time and served via its own Nginx stage)
  frontend:
    build:
      context: ./template
      args:
        VITE_API_URL: /api
    container_name: wms-frontend
    depends_on:
      - backend
    networks:
      - wms-network
    restart: unless-stopped

  # Nginx (entry point / reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: wms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wms-network

volumes:
  uploads_data:

networks:
  wms-network:
    driver: bridge