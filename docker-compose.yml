version: '3.8'

services:
  # 1. Database (Configured to match your local settings)
  postgres:
    image: postgres:15-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_DB: db              # Matches your application.properties
      POSTGRES_USER: postgres      # Matches your application.properties
      POSTGRES_PASSWORD: 3112      # Matches your application.properties
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend (Spring Boot)
  backend:
    build: .
    container_name: wms-backend
    ports:
      - "8090:8090"
    environment:
      # This overrides 'localhost' with 'postgres' (the service name above)
      DB_HOST: postgres
      SERVER_PORT: 8090

      # We don't need to override user/pass because your file defaults (3112) match the DB above!

      # Allow frontend access
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:5173,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads # Persist uploads
    networks:
      - wms-network
    restart: unless-stopped

  # 3. Frontend (React/Vite)
  frontend:
    build: ./template  # <--- CHECK THIS: Ensure this folder name matches your React folder
    container_name: wms-frontend
    ports:
      - "5173:5173"
    environment:

      VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - wms-network
    restart: unless-stopped

  # 4. Nginx (Optional - acts as the entry point)
  nginx:
    image: nginx:alpine
    container_name: wms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wms-network

volumes:
  postgres_data:
  uploads_data:

networks:
  wms-network:
    driver: bridge